[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulacrum"
version = "0.1.0"
description = "Extensible, replayable world simulation: declarative ecosystems, plugin agents/systems, optional LLM-driven factions, web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
simulacrum = "simulacrum.cli.main:main"

# Third-party packages extend Simulacrum by declaring, in their own pyproject.toml:
#   [project.entry-points."simulacrum.plugins"]
#   my_plugin = "my_package.simulacrum_plugin"
# The module registers components on import; it is loaded once at startup by the operator.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simulacrum = ["py.typed", "web/static/*", "ecosystems/*.json", "ecosystems/*.py"]

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "S", "PT"]
ignore = [
    "S311",   # random is used for simulation, not cryptography
    "RUF012", # mutable class attributes are not shared state here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]
"src/simulacrum/ecosystems/*.py" = ["B023"]

[tool.mypy]
python_version = "3.10"
packages = ["simulacrum"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: exercises several layers or runs a long simulation",
]

[tool.coverage.run]
source = ["simulacrum"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
